<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jay Gorsia – Wallpapers Volume I</title>
<link href="https://fonts.googleapis.com/css2?family=Inria+Serif&family=Manrope:wght@400;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#6f6f6e;--w:1120px;--pad:clamp(16px,5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#000;font-family:'Montserrat',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit}
.wrap{width:100%;max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
.crop{position:relative;overflow:hidden}.crop img{position:absolute;max-width:none}
hr{border:0;border-top:1px solid var(--ink);opacity:.5}
.view{display:none}.view.on{display:block;animation:dis .15s ease-out}
@keyframes dis{from{opacity:0}to{opacity:1}}
/* home */
.hero{text-align:center;padding-top:clamp(24px,5vw,70px)}
.hero .logo{width:min(879px,86%);margin:0 auto;aspect-ratio:879/341;object-fit:cover}
.hero h1{font-weight:300;color:var(--ink);font-size:clamp(28px,6.2vw,70px);letter-spacing:.2em;margin-top:clamp(12px,3vw,40px);padding-left:.2em}
.hero .vol{width:min(703px,70%);margin:clamp(14px,2.6vw,36px) auto 0;border-top:2px solid var(--ink)}
.hero h2{font-family:'Inria Serif',serif;font-weight:400;color:var(--ink);font-size:clamp(22px,4.6vw,66px);letter-spacing:.2em;margin-top:clamp(12px,2.4vw,32px);padding-left:.2em}
.mark{width:min(432px,60%);aspect-ratio:432/355;margin:clamp(24px,5vw,70px) auto}
.mark img{width:200%;height:263.15%;left:0;top:-162.78%}
.collection{text-align:center;padding:clamp(24px,5vw,60px) 0}
.collection h3{font-weight:400;color:var(--ink);font-size:clamp(28px,5.7vw,82px);margin-top:clamp(20px,4vw,56px)}
.collection p{color:var(--ink);font-size:clamp(15px,2.1vw,30px);line-height:1.3;text-align:justify;max-width:883px;margin:clamp(16px,3vw,40px) auto 0}
.flat{position:relative;width:min(100%,1457px);margin:clamp(24px,5vw,70px) auto 0}
.flat>img{width:100%;aspect-ratio:1457/1796;object-fit:cover}
.dl{position:absolute;right:2.5%;bottom:3.5%;width:clamp(44px,5.3vw,76px);aspect-ratio:76/73;background:#6f6f6f;border-radius:23%;display:grid;place-items:center}
.dl img{width:58%}
.murals{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(28px,5vw,70px) clamp(16px,11vw,154px);padding:clamp(24px,5vw,70px) 0}
.card{display:block;text-decoration:none;cursor:pointer}
.ph{aspect-ratio:482/341;width:100%;overflow:hidden;position:relative;background:#eee}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}.ph img.on{opacity:1}
.card span{display:block;margin-top:clamp(6px,1vw,14px);font-size:clamp(11px,1.75vw,25px);letter-spacing:.02em;text-transform:uppercase}
@media(max-width:560px){.murals{grid-template-columns:1fr}}
/* detail */
.d-top{padding-top:clamp(20px,4vw,56px);color:var(--ink)}
.d-top .tag{font-size:clamp(14px,2.4vw,34px);letter-spacing:.14em}
.d-top .tag small{display:block;font-weight:700;font-size:.62em;letter-spacing:.02em}
.back{display:inline-block;margin-bottom:12px;font-size:14px;text-decoration:none;cursor:pointer;border-bottom:1px solid}
.d-top h4{font-weight:400;font-size:clamp(24px,4vw,57px);text-align:center;margin-top:clamp(8px,1.5vw,20px)}
.d-top h1{font-weight:500;font-size:clamp(34px,6vw,86px);text-align:center;line-height:1.15}
.d-hero{width:100%;aspect-ratio:1199/770;object-fit:cover;margin-top:clamp(16px,3vw,40px)}
.d-desc{color:var(--ink);font-weight:400;font-size:clamp(14px,1.5vw,20px);line-height:1.5;max-width:624px;margin:clamp(14px,2vw,28px) 0 clamp(24px,5vw,70px)}
.sw{display:grid;grid-template-columns:656fr 579fr;gap:clamp(12px,5vw,76px);align-items:start;margin-bottom:clamp(24px,5vw,70px)}
.sw .l{aspect-ratio:656/1346}.sw .r{aspect-ratio:579/1023}
.sw p{color:var(--ink);font-weight:400;font-size:clamp(12px,1.4vw,20px);margin:clamp(20px,9vw,130px) 0 clamp(8px,1.5vw,20px)}
.cw{margin:0 auto clamp(20px,3vw,40px);text-align:center;max-width:965px}
.cw img{width:100%;aspect-ratio:965/322;object-fit:cover}
.cw p,.chips span{color:var(--ink);font-weight:400;font-size:clamp(12px,1.4vw,20px);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0 0 clamp(24px,5vw,60px)}
.diag{container-type:inline-size;position:relative;width:100%;max-width:1231px;margin:clamp(20px,4vw,50px) auto;aspect-ratio:1231/715}
.diag .t{position:absolute;left:0;right:0;top:0;text-align:center;font-weight:400;font-size:max(9px,1.6cqw)}
.diag .im{position:absolute;left:0;top:8%;width:100%;height:90.4%;overflow:hidden}
.diag .im img{position:absolute;left:50%;top:50%;max-width:none}
.diag b{position:absolute;background:#fff;color:#000;font-weight:400;display:grid;place-items:center;font-size:max(7px,1cqw);text-align:center}
.spec{background:#000;color:#fff;margin-top:clamp(24px,4vw,60px);padding:clamp(24px,5vw,70px) 0}
.spec img.bk{width:100%;max-width:1289px;margin:0 auto clamp(20px,4vw,50px);aspect-ratio:1289/921;object-fit:cover}
.spec dl{display:grid;grid-template-columns:minmax(110px,344px) 1fr;gap:clamp(12px,2.6vw,36px) 16px;font-weight:400;font-size:clamp(14px,2.1vw,30px);line-height:1.25}
footer{padding:clamp(24px,5vw,70px) 0 clamp(24px,4vw,50px);font-family:'Manrope',sans-serif;font-weight:400;font-size:clamp(14px,1.4vw,20px);line-height:1.4}
footer b{font-weight:700;display:block;margin-bottom:8px}
.f-logo{width:min(274px,50%);aspect-ratio:274/226}
.f-logo img{width:200.2%;height:262.43%;left:-.1%;top:-162.43%}
.f-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:clamp(14px,2vw,24px) 0;border-top:1px solid #000}
.f-row.first{margin-top:clamp(20px,3vw,40px)}
.qr{width:71px;height:70px;transform:scaleY(-1)}
.social{display:flex;gap:16px;margin-top:8px}.social .crop{width:clamp(54px,7vw,104px);aspect-ratio:1}
.in img{width:189.29%;height:193.69%;left:-44.64%;top:-48.01%}.ig img{width:503.97%;height:372.35%;left:-46.86%;top:-50.65%}
.copy{border-top:1px solid #000;padding-top:clamp(14px,2vw,24px);max-width:713px}
</style></head><body>

{n:"Garden Reverie",s:"garden-reverie",i:["7a3cf456-91f6-4056-a3ab-d70873ea2ec3","d2fbe34b-9eb2-4ce7-a45f-ae784b051e21","0db04ead-8ddb-4a66-8733-a4a84fda5cee","149c5cf3-d345-45b5-915f-3c451a5399be","1fd52c4d-d332-42a4-ab4d-0cd2121f549f"],d:"A botanical mural blending delicate textures and soft tones to bring natural elegance and tranquility to any space.",c:5,k:"Horizontal lined texture wallcovering with anti-scratch coating for longer life.",g:"240 gsm",m:"Panoramic of 10.7696 m x 3 m = 32.30 m² (424\" x 118.1\" = 347.67 sq.ft.)",w:["Iridescent","OG","Pastel Gray","Umber"]},

{n:"Dusk Leaf",s:"dusk-leaf",i:["5eac0f0f-a72e-4e60-b4d9-a7c19cb975c4"],d:"Dusk Leaf captures the serenity of twilight foliage through soft textures, muted tones, and graceful botanical forms, creating a timeless statement for refined interiors.",c:5,k:"Horizontal lined texture wallcovering with anti-scratch coating for longer life.",g:"280 gsm",m:"Panoramic of 6.09 m x 3 m = 18.27 m² (240\" x 118.1\")",w:["Misty Silver","Charcoal Gray","Red Stain","Rust"]},
{n:"Fragments",s:"fragments",i:["c4ae5858-0493-4a80-a9a3-08d4b322aaba"],d:"Zerzura brings the mystery of a mythical desert oasis to life on a rich velvet backdrop.",c:5,k:TX,g:"260 gsm",m:P,w:["OG","Powder Blue","Midnight Blue","Mist Grey","Sandstone"]},

{n:"Iris",s:"iris",i:["a4b55997-7ce8-484b-819f-259c1f8b2a31"],d:"Zerzura brings the mystery of a mythical desert oasis to life on velvet.",c:5,k:TX,g:"260 gsm",m:P,w:["OG","Green Wash","Charcoal","Tan"]},

{n:"Valley Flowers",s:"valley-flowers",i:["6341e89f-7ff2-465a-861e-50ff03874382"],d:"Zerzura captures the allure of a legendary lost oasis.",c:5,k:NW,g:"260 gsm",m:P,w:["Charcoal","Iridescent","Taupe","","Sepia"]},
{n:"Victory",s:"victory",i:["60eceaf9-be27-4118-9b6e-b3d3b4727620"],d:"Victory celebrates strength and confidence through striking wildlife imagery and rich charcoal textures, creating a bold yet refined visual statement.",c:5,k:NW,g:"260 gsm",m:P,w:["Blue Wash","Mono","","Dark Charcoal"]},
{n:"White Cockatoo",s:"white-cockatoo",i:["324b3809-241f-411a-a2da-e6f34ddf2330"],d:"Graceful White Cockatoos emerge through layered foliage and organic textures, creating a serene composition inspired by nature. Soft earthy tones and subtle contrasts bring timeless elegance to both contemporary and classic interiors.",c:5,k:NW,g:"260 gsm",m:P,w:["Long Wallpaper","Charcoal","Mono","OG","Pastel Beige","Burnt Taupe"]},
{n:"Wisteria",s:"wisteria",i:["e46f74dc-594f-4e1a-8f4c-22fc22f63abe"],d:"Cascading wisteria blooms drift gracefully across a soft textured backdrop, creating a tranquil and romantic composition. Delicate petals, gentle hues, and botanical elegance bring a timeless charm that complements both modern and classic interiors.",c:5,k:TX,g:"260 gsm",m:P,w:["Custom Placement","OG Without Birds","OG","Silver","Tan"]}];

M[0].hero=U("f179ca98-bf34-46e4-b2c4-3027be539aba");
M[0].sw=[U("f6d3ae4a-e542-4cf5-9a71-eb583bf1a94e"),U("6fc3bd72-0dc2-4044-8e51-f320b602658b")];
M[0].cap="Inspired by Acalypha foliage, rich greens meet velvety elegance.";
M[0].cw=[U("5500aec2-3e6e-4ff4-b758-0ac6ea6af96b"),U("69e05549-0bee-4f87-b761-9c0bf4f048f4"),U("6bf8cf74-157f-4335-b6c7-66b2b846cd59"),U("882eafbe-3b34-49cc-9ef5-301c398ee785")];
M[0].diag=U("67a559f0-023f-4f29-92e6-b13c63faadcb");M[0].bk=U("30457c3f-24e2-4baf-bcc0-9fa6d4bba0fc");

const foot=()=>`<footer class="wrap"><div class="f-logo crop"><img alt="" src="${A.f3}"></div>
<div class="f-row first"><div><b>Website</b><a href="https://jaygorsia.com/intro/" target="_blank" rel="noopener">jaygorsia.com</a></div><img class="qr" alt="QR" src="${A.qr}"></div>
<div class="f-row"><div><b>Contact</b>info@gorsiadesign.com</div></div>
<div class="f-row"><div><b>Follow us</b>@thejaygorsia &nbsp; #jay gorsia<div class="social"><a class="crop ig" href="https://www.instagram.com/thejaygorsia/" target="_blank" rel="noopener"><img alt="Instagram" src="${A.ig}"></a><a class="crop in" href="https://www.linkedin.com/company/jay-gorsia/posts/" target="_blank" rel="noopener"><img alt="LinkedIn" src="${A.li}"></a></div></div></div>

<div class="copy"><b>Copyright</b>© 2026 Gorsia Pvt. Ltd. All Rights Reserved. No part of this catalog may be reproduced or distributed in any form without prior written permission of Gorsia Pvt. Ltd.</div></footer>`;
function home(){
 document.getElementById('home').innerHTML=`<header class="hero"><img class="logo" alt="Jay Gorsia" src="${A.logo}"><h1>WALLPAPERS</h1><div class="vol"></div><h2>VOLUME. I</h2><div class="mark crop"><img alt="" src="${A.mark}"></div></header><hr>
<section class="collection"><div class="wrap"><h3>THE COLLECTION</h3><p>The Jay Gorsia wallpaper catalogue brings together art, texture and design, creating distinctive expressions for contemporary interiors.</p></div>
<div class="flat"><img alt="Collection flat lay" src="${A.flat}"><a class="dl" href="https://drive.google.com/uc?export=download&id=1QWa1HfoddN3hFXdn2LcQixtYmQaz7sWo" target="_blank" rel="noopener" aria-label="Download"><img alt="" src="${A.dl}"></a></div></section><hr>
<main class="wrap"><div class="murals">${M.map(m=>`<a class="card" href="#${m.s}"><div class="ph">${m.i.map((x,k)=>`<img loading="lazy" alt="Mural: ${m.n}" class="${k?'':'on'}" src="${U(x)}">`).join('')}</div><span>Mural: ${m.n}</span></a>`).join('')}</div></main><hr>${foot()}`;
 /* prototype: after 1.5s the card image changes to its next variant */
 document.querySelectorAll('.ph').forEach(p=>{const im=p.querySelectorAll('img');if(im.length<2)return;let i=0;setInterval(()=>{im[i].classList.remove('on');i=(i+1)%im.length;im[i].classList.add('on')},1500)});
}
function detail(m){
 const hero=m.hero||U(m.i[0]);
 let h=`<div class="wrap d-top"><a class="back" href="javascript:void(0)" onclick="location.hash=''">← The Collection</a><div class="tag">BESPOKE<small>WALLCOVERINGS</small></div><h4>Mural</h4><h1>${up(m.n)}</h1><img class="d-hero" alt="${m.n}" src="${hero}"><p class="d-desc">${m.d}</p>`;
 if(m.sw)h+=`<div class="sw"><div class="crop l"><img alt="" style="height:120.65%;left:-85.94%;top:-10.33%;width:350.09%" src="${m.sw[0]}"></div><div><p>${m.cap}</p><div class="crop r"><img alt="" style="height:100.49%;left:0;top:-.25%;width:250.94%" src="${m.sw[1]}"></div></div></div>`;
 if(m.cw)h+=m.cw.map((x,k)=>`<div class="cw"><img loading="lazy" alt="" src="${x}"><p>${m.n}${m.w[k]?' - '+m.w[k].toLowerCase():''}</p></div>`).join('');
 else h+=`<div class="chips">${m.w.map(x=>`<span>${m.n}${x?' - '+x:''}</span>`).join('')}</div>`;
 if(m.diag){const bars=[48.9,220,391,562,729.8,903,1080];
  h+=`<div class="diag"><div class="t">${up(m.n)}</div><div class="im"><img alt="" style="width:52.5cqw;height:100cqw;transform:translate(-50%,-50%) rotate(90deg);left:50%;top:50%;max-width:none" src="${m.diag}"></div>

 h+=`</div><section class="spec"><div class="wrap">${m.bk?`<img class="bk" alt="" src="${m.bk}">`:''}<dl><dt>Murals:</dt><dd>${m.n}</dd><dt>Colourways:</dt><dd>${m.c} colours available</dd><dt>Composition:</dt><dd>${m.k}</dd><dt>Width:</dt><dd>55 inches</dd><dt>Thickness:</dt><dd>${m.g}</dd><dt>Dimensions:</dt><dd>${m.m}</dd><dt>Remark:</dt><dd>Designed as a non-repeating pattern, it can be modified and personalized to meet individual specifications.</dd></dl></div></section>${foot()}`;
 document.getElementById('detail').innerHTML=h;
}
function route(){
 const s=location.hash.slice(1),m=M.find(x=>x.s===s),hv=document.getElementById('home'),dv=document.getElementById('detail');
 const show=el=>{[hv,dv].forEach(v=>v.classList.remove('on'));void el.offsetWidth;el.classList.add('on');window.scrollTo(0,0)};/* dissolve + scroll reset */
 if(m){detail(m);show(dv)}else show(hv);
}
home();window.addEventListener('hashchange',route);route();
</script></body></html>
